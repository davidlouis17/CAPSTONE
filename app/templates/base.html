<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ app_name }} — Kurasi Sepatu Bekas COE{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css" />
</head>
<body class="bg-stone-50 text-stone-900 antialiased min-h-screen flex flex-col">
    <header class="bg-white border-b border-stone-200 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-lg font-semibold tracking-tight text-stone-900">
                Local Thrift
            </a>
            <nav class="flex items-center gap-5 text-sm text-stone-600">
                <a href="/catalog" class="hover:text-stone-900 transition font-medium">Katalog</a>
                {% if admin is defined and admin %}
                <a href="/admin" class="hover:text-stone-900 transition font-medium text-emerald-700">Dasbor Admin</a>
                <form method="post" action="/admin/logout" class="inline">
                    <button type="submit" class="text-stone-500 hover:text-red-700 transition">Keluar</button>
                </form>
                {% else %}
                <a href="/admin" class="px-3 py-1.5 rounded-lg border border-stone-300 text-stone-800 hover:bg-stone-100 transition font-medium">
                    Panel Admin
                </a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-stone-200 bg-white mt-12">
        <div class="max-w-6xl mx-auto px-6 py-6 text-xs text-stone-500 flex flex-col sm:flex-row justify-between gap-2">
            <span>Local Thrift — Program Kurasi Sepatu Bekas COE Telkom University Surabaya</span>
            <span>Penilaian kondisi visual 4 sisi · Penetapan grade &amp; harga transparan</span>
        </div>
    </footer>
</body>
</html>
