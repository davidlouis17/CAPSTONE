<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ app_name }} — Kurasi Sepatu Bekas COE{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css" />
</head>
<body class="bg-stone-50 text-stone-900 antialiased min-h-screen flex flex-col">
    <header class="bg-white border-b border-stone-200">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-lg font-semibold tracking-tight text-stone-900">
                Local Thrift
            </a>
            <nav class="flex items-center gap-6 text-sm text-stone-600">
                <a href="/" class="hover:text-stone-900 transition">Beranda</a>
                <a href="/health" class="hover:text-stone-900 transition">Status API</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-stone-200 bg-white">
        <div class="max-w-6xl mx-auto px-6 py-5 text-xs text-stone-500 flex flex-col sm:flex-row justify-between gap-2">
            <span>Local Thrift — COE Telkom University Surabaya</span>
            <span>FastAPI · Jinja2 · Tailwind CSS · SQLite · Python CNN</span>
        </div>
    </footer>
</body>
</html>
